<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroLauncher · Play</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    html, body {
      background: #000;
      height: 100%;
    }
    .play-topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .play-topbar h2 {
      margin: 0;
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #game {
      width: 100%;
      height: calc(100vh - 49px);
    }
    .play-message {
      color: var(--text);
      padding: 60px 24px;
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="play-topbar">
    <button class="btn" onclick="window.location.href='/'">← Back to Library</button>
    <h2 id="play-title">Loading...</h2>
  </div>
  <div id="game"></div>
  <div id="play-message" class="play-message" hidden></div>

  <script src="/static/js/play.js"></script>
</body>
</html>
