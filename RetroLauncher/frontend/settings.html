<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroLauncher · Settings</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar">
      <h1>Retro<span>Launcher</span></h1>
      <button class="nav-item" data-nav onclick="window.location.href='/'">← Back to Library</button>
      <div class="sidebar-footer"></div>
    </nav>

    <div class="main">
      <div class="topbar">
        <h2>Settings</h2>
      </div>
      <div class="content">

        <div class="panel">
          <h3>Platforms</h3>
          <div id="platform-rows"></div>
          <form id="platform-form">
            <div class="form-row">
              <label for="p-name">Name</label>
              <input id="p-name" required placeholder="e.g. Nintendo Entertainment System" />
            </div>
            <div class="form-row">
              <label for="p-folder">ROM folder (absolute path on this machine)</label>
              <input id="p-folder" required placeholder="/roms/nes" />
            </div>
            <div class="form-row">
              <label for="p-ext">Extensions (comma separated)</label>
              <input id="p-ext" required placeholder=".nes,.zip" />
            </div>
            <button class="btn primary" type="submit" data-nav>+ Add Platform</button>
          </form>
        </div>

        <div class="panel">
          <h3>Emulators</h3>
          <div class="form-row">
            <label for="e-platform">Platform</label>
            <select id="e-platform" class="search-box" style="max-width: 320px"></select>
          </div>
          <div id="emulator-rows"></div>
          <form id="emulator-form">
            <div class="form-row">
              <label for="e-name">Emulator name</label>
              <input id="e-name" required placeholder="e.g. Mesen" />
            </div>
            <div class="form-row">
              <label for="e-exec">Executable path</label>
              <input id="e-exec" required placeholder="/usr/bin/mesen" />
            </div>
            <div class="form-row">
              <label for="e-args">Launch arguments (use {rom} for the ROM path)</label>
              <input id="e-args" value="{rom}" required />
            </div>
            <button class="btn primary" type="submit" data-nav>+ Add Emulator</button>
          </form>
        </div>

        <div class="panel">
          <h3>Metadata &amp; Box Art (IGDB)</h3>
          <p class="meta">
            Create a free Twitch developer app at
            <a href="https://dev.twitch.tv/console/apps" target="_blank" rel="noopener">dev.twitch.tv/console/apps</a>
            to get a Client ID + Secret, then paste them below.
          </p>
          <div class="form-row">
            <label for="s-client-id">IGDB Client ID</label>
            <input id="s-client-id" placeholder="Client ID" />
          </div>
          <div class="form-row">
            <label for="s-client-secret">IGDB Client Secret</label>
            <input id="s-client-secret" type="password" placeholder="Client Secret" />
          </div>
          <button class="btn primary" id="save-settings" data-nav>Save Metadata Settings</button>
        </div>

      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/js/gamepad.js"></script>
  <script src="/static/js/settings.js"></script>
</body>
</html>
