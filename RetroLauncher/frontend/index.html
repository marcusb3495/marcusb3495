<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RetroLauncher</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar">
      <h1>Retro<span>Launcher</span></h1>

      <button class="nav-item active" data-nav data-platform-id="">
        <span>All Games</span>
      </button>
      <button class="nav-item" data-nav data-favorites="1">
        <span>★ Favorites</span>
      </button>

      <div id="platform-list"></div>

      <div class="sidebar-footer">
        <div class="gamepad-indicator" id="gamepad-indicator">
          <span class="dot"></span>
          <span id="gamepad-status">No controller</span>
        </div>
        <button class="nav-item" onclick="window.location.href='/settings.html'">⚙ Settings</button>
      </div>
    </nav>

    <div class="main">
      <div class="topbar">
        <h2 id="content-title">All Games</h2>
        <input class="search-box" id="search" type="text" placeholder="Search games... (press / to focus)" />
      </div>
      <div class="content">
        <div class="grid" id="grid"></div>
        <div class="empty-state" id="empty-state" hidden></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal">
      <button class="close-btn" id="modal-close">✕</button>
      <div class="cover" id="modal-cover">No Cover</div>
      <div>
        <h3 id="modal-title"></h3>
        <div class="meta" id="modal-meta"></div>
        <p class="description" id="modal-description"></p>
        <div class="actions">
          <button class="btn primary" id="modal-play-browser" data-nav>▶ Play in Browser</button>
          <button class="btn" id="modal-launch" data-nav>Launch Native Emulator</button>
          <button class="btn" id="modal-favorite" data-nav>☆ Favorite</button>
          <button class="btn" id="modal-scrape" data-nav>⤓ Fetch Metadata</button>
        </div>
        <div id="scrape-results"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/js/gamepad.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
